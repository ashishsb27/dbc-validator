name: Run Pytest
on: [push] # this triggeres the actio every time a push is made to the repository

jobs:
  build:
    runs-on: ubuntu-latest # this spins up a linux server on linux for the job to run on

    steps:
      - uses: actions/checkout@v3 # this checks out the repository so that the workflow can access it

      - name: set up python3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Run Black (Code Formatting)
      #   run: black --check . # this checks if the code is formatted according to black's standards. Pipeline will fail if code is not formatted correctly.

      # - name: Run flake8 (Linting)
      #   run: flake8 .

      - name: Run ruff Formatting
        run: ruff format --check . # this checks if the code is formatted according to ruff's standards. Pipeline will fail if code is not formatted correctly.

      - name: Run ruff Lintering
        run: ruff check . # this checks if the code is formatted according to ruff's standards. Pipeline will fail if code is not formatted correctly.

      - name: Run mypy (Type Checks)
        run: mypy . --ignore-missing-imports

      - name: Run tests
        run: pytest # this runs the tests in the repository using pytest
